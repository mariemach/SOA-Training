enum TypeModule {
    TRANSVERSAL
    PROFESSIONNEL
    RECHERCHE
}

type UniteEnseignement {
    code: Int
    domaine: String
    responsable: String
    credits: Int
    semestre: Int
}

type Module {
    matricule: String
    nom: String
    coefficient: Int
    volumeHoraire: Int
    type: TypeModule
    uniteEnseignement: UniteEnseignement
}

type QueryResolver {
    # Operations pour Modules
    allModules: [Module]
    getModulesByType(type: TypeModule!): [Module]
    getModuleByMatricule(matricule: String!): Module

    # Operations pour Unites d'Enseignement
    allUEs: [UniteEnseignement]
    getUEByCode(code: Int!): UniteEnseignement
    getUEByDomaine(domaine: String!): [UniteEnseignement]
    getUEBySemestre(semestre: Int!): [UniteEnseignement]
}

type MutationResolver {
    # Operations pour Modules
    createModule(
        matricule: String!
        nom: String!
        coefficient: Int!
        volumeHoraire: Int!
        type: TypeModule!
        codeUE: Int
    ): Boolean

    addModule(
        matricule: String!
        nom: String!
        coefficient: Int!
        volumeHoraire: Int!
        type: TypeModule!
        codeUE: Int
    ): Boolean

    updateModule(
        matricule: String!
        nom: String!
        coefficient: Int!
        volumeHoraire: Int!
        type: TypeModule!
        codeUE: Int
    ): Boolean

    deleteModule(matricule: String!): Boolean

    # Operations pour Unites d'Enseignement
    addUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    createUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    updateUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    deleteUniteEnseignement(code: Int!): Boolean
}

schema {
    query: QueryResolver
    mutation: MutationResolver
}